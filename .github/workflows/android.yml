name: Build ARTUR-TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          pwd
          ls -la
          find . -name gradlew -not -path "./.git/*"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: |
          GW=$(find . -name gradlew -not -path "./.git/*" | head -n1)
          if [ -z "$GW" ]; then echo "gradlew not found"; exit 1; fi
          DIR=$(dirname "$GW")
          chmod +x "$GW"
          cd "$DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTUR-TV-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
