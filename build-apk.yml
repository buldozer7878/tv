name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm install

      # В репозитории нет папки android/ — генерируем нативный проект из app.json
      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      # Release, а не Debug: debug-APK ждёт Metro-сервер и без него не покажет экран.
      # Release из шаблона Expo подписывается debug-ключом — ставится на телефон как есть.
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tehnolog-apk
          path: android/app/build/outputs/apk/release/*.apk
